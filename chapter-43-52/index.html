      <h2>Student Records</h2>

    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic rows will be inserted here via JavaScript -->
        </tbody>
    </table>

    <script>
        // 1. Array containing 10 initial student records
        const students = [
            { id: 101, name: "Alice Johnson", age: 20, grade: "A" },
            { id: 102, name: "Bob Smith", age: 21, grade: "B" },
            { id: 103, name: "Charlie Brown", age: 19, grade: "A" },
            { id: 104, name: "Diana Prince", age: 22, grade: "A+" },
            { id: 105, name: "Evan Wright", age: 20, grade: "C" },
            { id: 106, name: "Fiona Gallagher", age: 21, grade: "B" },
            { id: 107, name: "George Brooks", age: 22, grade: "B+" },
            { id: 108, name: "Hannah Abbott", age: 19, grade: "A" },
            { id: 109, name: "Ian Malcolm", age: 23, grade: "B" },
            { id: 110, name: "Julia Roberts", age: 20, grade: "A" }
        ];

        const tableBody = document.querySelector("#studentTable tbody");

        // 2. Function to populate the table with student data
        function populateTable() {
            students.forEach(student => {
                // Create a new row element
                const row = document.createElement("tr");

                // Populate row cells with student details and a delete button
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.age}</td>
                    <td>${student.grade}</td>
                    <td><button class="delete-btn">Delete</button></td>
                `;

                // 3. Add click event listener directly to the delete button
                const deleteButton = row.querySelector(".delete-btn");
                deleteButton.addEventListener("click", function() {
                    row.remove(); // Removes the entire row from the DOM
                });

                // Append the completed row to the table body
                tableBody.appendChild(row);
            });
        }

        // Initialize the table layout on page load
        populateTable();
    </script>

    <h2>Counter Application</h2>
    
    <!-- Heading to display the current counter value -->
    <h1 id="counterValue">0</h1>

    <!-- Action buttons -->
    <button onclick="decrease()">Decrease</button>
    <button onclick="increase()">Increase</button>

    <script>
        // Initialize the counter variable
        var count = 0;
        var counterHeading = document.getElementById("counterValue");

        // Function to increment counter
        function increase() {
            count++;
            counterHeading.innerText = count;
        }

        // Function to decrement counter
        function decrease() {
            count--;
            counterHeading.innerText = count;
        }
    </script>

    <h2>Hover over the image to change it:</h2>
    
    <!-- Image with mouseover and mouseout event attributes -->
    <img id="myImage" 
         src="./images/images.jpg" 
         alt="First Picture"
         onmouseover="changePic()" 
         onmouseout="resetPic()" 
         style="width: 300px; height: 200px; cursor: pointer; transition: 0.3s;">

    <script>
        var image = document.getElementById("myImage");

        // Runs when mouse hovers over the image
        function changePic() {
            image.src = "https://picsum.photos";
        }

        // Runs when mouse leaves the image
        function resetPic() {
            image.src = "https://picsum.photos";
        }
    </script>

     <script src="app.js"></script>
